[project]
name = "uncertainty-aware-retfound"
version = "0.1.0"
description = "Research project on uncertainty-aware RETFound adaptation for calibrated retinal disease classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub~=0.23.4",
    "pandas>=3.0.3",
    "pillow>=11.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "timm~=0.9.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kaggle>=2.2.2",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
